<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcc8f2"/>
      <stop offset="30%" stop-color="#c8d8f4"/>
      <stop offset="55%" stop-color="#f2eedd"/>
      <stop offset="80%" stop-color="#f4d4e8"/>
      <stop offset="100%" stop-color="#c8ead8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-15, 253, 254)">
    <!-- Ticket body -->
    <rect x="58" y="170" width="390" height="168" rx="20" ry="20" fill="url(#holo)"/>
    <!-- Holographic sheen -->
    <rect x="58" y="170" width="390" height="168" rx="20" ry="20" fill="url(#sheen)"/>
    <!-- Top notch -->
    <circle cx="318" cy="170" r="18" fill="white"/>
    <!-- Bottom notch -->
    <circle cx="318" cy="338" r="18" fill="white"/>
    <!-- Perforation dashes -->
    <line x1="318" y1="188" x2="318" y2="320" stroke="#8898b2" stroke-width="3.5" stroke-dasharray="8,8"/>

    <!-- Columbia Crown (replacing the star) -->
    <path d="
      M 140,294
      L 140,272
      L 147,272 L 147,220 L 153,212 L 159,220 L 159,272
      L 163,272 L 163,240 L 169,236 L 175,240 L 175,272
      L 179,272 L 179,220 L 185,212 L 191,220 L 191,272
      L 195,272 L 195,240 L 201,236 L 207,240 L 207,272
      L 211,272 L 211,220 L 217,212 L 223,220 L 223,272
      L 230,272
      L 230,294
      Z
    " fill="#1e2d4d"/>
    <!-- Orbs at tips of the three tall teeth -->
    <circle cx="153" cy="212" r="5" fill="#1e2d4d"/>
    <circle cx="185" cy="212" r="5" fill="#1e2d4d"/>
    <circle cx="217" cy="212" r="5" fill="#1e2d4d"/>

    <!-- Barcode (right section) -->
    <g fill="#1e2d4d">
      <rect x="362" y="210" width="3"  height="88"/>
      <rect x="367" y="210" width="6"  height="88"/>
      <rect x="375" y="210" width="2"  height="88"/>
      <rect x="379" y="210" width="5"  height="88"/>
      <rect x="386" y="210" width="3"  height="88"/>
      <rect x="391" y="210" width="7"  height="88"/>
      <rect x="400" y="210" width="2"  height="88"/>
      <rect x="404" y="210" width="4"  height="88"/>
      <rect x="410" y="210" width="3"  height="88"/>
      <rect x="415" y="210" width="5"  height="88"/>
      <rect x="422" y="210" width="2"  height="88"/>
    </g>
  </g>
</svg>
